[project]
name = "langgraph-agentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "naveenreddu2709", email = "naveenreddu89@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.16",
    "langsmith>=0.14.11",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langgraph-agentic = "langgraph_agentic:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
